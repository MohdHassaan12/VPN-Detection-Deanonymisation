# config.yaml
# VPN Detection Demo – configuration

capture:
  interface: en0            # macOS WiFi interface (en0/bridge100/en1)
  bpf_filter: "ip"          # BPF filter; use "host <IP>" to target a device
  max_queue_size: 5000      # internal packet queue depth
  
feature_extraction:
  window_size: 50           # sliding window: number of packets per feature vector
  flow_timeout_sec: 60      # stale flow purge threshold (seconds)

model:
  path: model/vpn_classifier.joblib
  n_features: 11

risk_scoring:
  low_max: 20               # risk score 0–20   → LOW
  medium_max: 60            # risk score 21–60  → MEDIUM
  # anything above medium_max → HIGH

dashboard:
  port: 8511                # streamlit default
  refresh_interval_ms: 1000 # auto-refresh interval in milliseconds
  max_log_entries: 50       # keep up to N entries in the event log

demo:
  mock_devices:
    - ip: "10.0.0.2"
      label: "Mobile (iPhone)"
    - ip: "10.0.0.3"
      label: "Laptop (MacBook)"
    - ip: "10.0.0.4"
      label: "Tablet (iPad)"
